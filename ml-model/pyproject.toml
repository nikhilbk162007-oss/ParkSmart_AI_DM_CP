[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parksmart-ml-model"
version = "0.1.0"
description = "Synthetic parking occupancy model and inference package"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.8,<1.9",
    "joblib>=1.5,<2",
]

[tool.setuptools]
packages = ["ml_model"]
