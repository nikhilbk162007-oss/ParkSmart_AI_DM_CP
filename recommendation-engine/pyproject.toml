[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parksmart-recommendation-engine"
version = "0.1.0"
description = "Graph-based parking recommendation engine for ParkSmart AI"
requires-python = ">=3.11"
dependencies = ["scipy>=1.10"]

[tool.setuptools]
packages = ["recommendation_engine"]
